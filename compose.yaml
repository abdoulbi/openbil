x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://openbil:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/openbil
  volumes:
    - raw:/app/data
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: openbil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openbil
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbil -d openbil"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *app
    command: ["openbil", "migrate"]
    restart: "no"
  collector:
    <<: *app
    command: ["openbil", "schedule"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  dashboard:
    <<: *app
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres:
  raw:
