# Deployment proposal only. These resources are PAID; review Render's estimate
# before applying this Blueprint. Committing this file does not deploy it.
services:
  - type: web
    name: openbil-dashboard
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.lock && pip install --no-deps .
    startCommand: python scripts/start_service.py
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ROLE
        value: dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: openbil-db
          property: connectionString
  - type: worker
    name: openbil-collector
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.lock && pip install --no-deps .
    startCommand: python scripts/start_service.py
    disk:
      name: openbil-raw
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ROLE
        value: collector
      - key: DATABASE_URL
        fromDatabase:
          name: openbil-db
          property: connectionString
databases:
  - name: openbil-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: openbil
    user: openbil
    diskSizeGB: 5
    ipAllowList: []
