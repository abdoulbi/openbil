# Free demonstration only. No paid database, disk or worker is provisioned.
services:
  - type: web
    name: openbil-free
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.lock && pip install --no-deps .
    startCommand: streamlit run app_free.py --server.address=0.0.0.0 --server.port=$PORT --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
