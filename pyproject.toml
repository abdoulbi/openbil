[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "openbil"
version = "0.2.0"
description = "Auditable economic data pipeline for Africa"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx[socks]>=0.27,<1", "pandas>=2.2,<3", "numpy>=2,<3", "streamlit>=1.66,<2", "apscheduler>=3.10,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[project.scripts]
openbil = "openbil.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL", "live: explicit network integration"]
