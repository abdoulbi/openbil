name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openbil
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: openbil_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openbil -d openbil_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://openbil:test_only@localhost:5432/openbil_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pytest -q
